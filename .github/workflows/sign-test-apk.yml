name: sign test apk
# Manual only. Three jobs: (1) gate: verifier/checker self-tests, no secrets; (2) build: runs the
# repo's tests and Gradle on the exact main commit with NO secrets and uploads the unsigned APK;
# (3) sign: minimal job that holds the key, downloads that exact unsigned APK, checks its SHA-256,
# signs and verifies it. No Gradle, pip or tests run in the signing job.
# It never creates a release, tag or commit. A reviewed person attaches the APK to a release by hand.
# NOT ACTIVE until the saku signing key exists, its four secrets (SAKU_SIGNING_KEYSTORE_BASE64,
# SAKU_SIGNING_STORE_PASSWORD, SAKU_SIGNING_KEY_PASSWORD, SAKU_SIGNING_KEY_ALIAS) are set, and the
# release commit replaces the placeholder EXPECTED_CERT_SHA256 below with the key certificate digest.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: QUALIFY runs the root demo tests and builds an unsigned APK; SIGN also runs the separately gated signing job
        required: true
        type: choice
        options:
          - QUALIFY
          - SIGN
        default: QUALIFY
permissions:
  contents: read
env:
  # SET in the release commit: 64 uppercase hex digits of the key certificate. Not a secret.
  EXPECTED_CERT_SHA256: B63521B928B4F8107F63785DE23718972381FACF4EA2749141A126C425CCEDB8
  # SET per release in the release commit: must equal the gradle defaults, tools/icon-version.txt and the icon badge.
  EXPECTED_VERSION_NAME: '0.1.1'
  EXPECTED_VERSION_CODE: '3'
  EXPECTED_PACKAGE: com.vanipy.saku
  EXPECTED_LABEL: saku
  BUILD_TOOLS_VERSION: 34.0.0
jobs:
  gate:
    if: ${{ (inputs.operation == 'QUALIFY' || inputs.operation == 'SIGN') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verifier self-test (synthetic bad inputs must fail)
        run: bash tools/test-verify-signed-apk.sh
      - name: Checker self-tests (test results; manifest permissions) - bad cases must fail
        run: |
          python3 tools/test-check-full-suite.py
          python3 tools/test-check-manifest-permissions.py
  build:
    needs: gate
    if: ${{ (inputs.operation == 'QUALIFY' || inputs.operation == 'SIGN') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      unsigned_sha256: ${{ steps.unsigned.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Version sidecar must equal the release version
        run: |
          set -euo pipefail
          [ "$(< tools/icon-version.txt)" = "$EXPECTED_VERSION_NAME" ] || { echo "tools/icon-version.txt differs from EXPECTED_VERSION_NAME"; exit 1; }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }
      - name: Gradle 8.10.2 (checksum verified)
        run: |
          curl -sL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          echo "31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26  /tmp/g.zip" | sha256sum -c -
          unzip -q /tmp/g.zip -d /tmp
      - name: Qualify exact commit (demo app tests, gating)
        run: |
          set -euo pipefail
          /tmp/gradle-8.10.2/bin/gradle --no-daemon --console=plain :app:testDebugUnitTest --tests 'com.vanipy.saku.VaultTest' --tests 'com.vanipy.saku.ScreenRenderTest'
          echo "saku gating demo-app tests passed (VaultTest, ScreenRenderTest incl. persistent-banner checks)" > test-summary.txt
      - name: Full suite, strict result check (only the one documented failure allowed)
        run: |
          set -uo pipefail
          rm -rf app/build/test-results
          start=$(date +%s)
          set +e
          /tmp/gradle-8.10.2/bin/gradle --no-daemon --console=plain :app:testDebugUnitTest --rerun --continue
          rc=$?
          set -e
          python3 tools/check-full-suite.py app/build/test-results/testDebugUnitTest tools/expected-tests.txt "$rc" "$start" test-summary.txt
          cat test-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Build unsigned release
        run: /tmp/gradle-8.10.2/bin/gradle --no-daemon --console=plain "-PversionName=$EXPECTED_VERSION_NAME" "-PversionCode=$EXPECTED_VERSION_CODE" :app:assembleRelease
      - name: Collect the single unsigned APK
        id: unsigned
        run: |
          set -euo pipefail
          [ "$(ls app/build/outputs/apk/release/*.apk | wc -l)" = 1 ]
          cp "$(ls app/build/outputs/apk/release/*.apk)" saku-unsigned.apk
          echo "sha256=$(sha256sum saku-unsigned.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saku-unsigned
          path: |
            saku-unsigned.apk
            test-summary.txt
            app/build/saku-mock-*-robolectric.png
          if-no-files-found: error
  sign:
    needs: build
    if: ${{ inputs.operation == 'SIGN' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: saku-unsigned
          path: unsigned
      - name: Unsigned APK must be byte-identical to what the build job produced
        env:
          WANT: ${{ needs.build.outputs.unsigned_sha256 }}
        run: |
          set -euo pipefail
          [[ "$WANT" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum unsigned/saku-unsigned.apk | cut -d' ' -f1)" = "$WANT" ]
      - name: Align and sign
        env:
          KS_B64: ${{ secrets.SAKU_SIGNING_KEYSTORE_BASE64 }}
          KS_STORE_PW: ${{ secrets.SAKU_SIGNING_STORE_PASSWORD }}
          KS_KEY_PW: ${{ secrets.SAKU_SIGNING_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.SAKU_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CERT_SHA256" =~ ^[0-9A-F]{64}$ ]] || { echo "EXPECTED_CERT_SHA256 not filled in; refusing to sign"; exit 1; }
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          [ -x "$bt/apksigner" ] && [ -x "$bt/zipalign" ]
          work=$(mktemp -d "$RUNNER_TEMP/sign.XXXXXX"); chmod 700 "$work"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$KS_B64" | base64 -d > "$work/app.jks"; chmod 600 "$work/app.jks"
          "$bt/zipalign" -f -p 4 unsigned/saku-unsigned.apk "$work/aligned.apk"
          printf '%s\n%s\n' "$KS_STORE_PW" "$KS_KEY_PW" > "$work/pw"
          "$bt/apksigner" sign --ks "$work/app.jks" --ks-key-alias "$KS_ALIAS" \
            --ks-pass "file:$work/pw" --key-pass "file:$work/pw" \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out "saku-v${EXPECTED_VERSION_NAME}.apk" "$work/aligned.apk"
          rm -f "$work/pw" "saku-v${EXPECTED_VERSION_NAME}.apk.idsig"
      - name: Verify the signed APK (no secrets in this step)
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          [ -x "$bt/aapt2" ]
          out="saku-v${EXPECTED_VERSION_NAME}.apk"
          "$bt/apksigner" verify --verbose --print-certs "$out" > verify.txt
          "$bt/aapt2" dump badging "$out" > badging.txt
          bash tools/verify-signed-apk.sh verify.txt badging.txt
          # No network or dangerous permission: the manifest must declare exactly one permission, AndroidX's
          # package-local one, with protectionLevel exactly signature (0x2), and request only that one.
          "$bt/aapt2" dump xmltree --file AndroidManifest.xml "$out" > manifest-tree.txt
          python3 tools/check-manifest-permissions.py manifest-tree.txt com.vanipy.saku.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
          sha256sum "$out" | tee "$out.sha256"
          cp unsigned/test-summary.txt test-summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saku-signed-test
          path: |
            saku-v*.apk
            saku-v*.apk.sha256
            verify.txt
            badging.txt
            manifest-tree.txt
            test-summary.txt
          if-no-files-found: error
